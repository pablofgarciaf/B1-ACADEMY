<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Nota de crédito: devolución física</title><desc id="desc">Ejemplo sin impuestos: venta de 100, costo de 50. Debe ingresos 100 e inventario 50; haber clientes 100 y costo de ventas 50. Retorna una unidad.</desc><rect width="1920" height="1080" fill="#f3f6fb"/><g font-family="Arial, sans-serif"><text x="110" y="112" fill="#497ba9" font-size="25" letter-spacing="4">ABONOS DE CLIENTES</text><text x="110" y="208" fill="#123e80" font-size="68" font-weight="700">Devolución física: efecto contable</text><text x="110" y="273" fill="#46576b" font-size="30">Una unidad vendida por 100; costo original 50. Ejemplo sin impuestos.</text><rect x="110" y="330" width="1180" height="565" rx="24" fill="white"/><path d="M134 330 H1266 Q1290 330 1290 354 V424 H110 V354 Q110 330 134 330" fill="#123e80"/><text x="144" y="390" fill="white" font-size="36" font-weight="700">Asiento de la nota de crédito</text><text x="145" y="478" fill="#556679" font-size="28">Cuenta</text><text x="1010" y="478" text-anchor="end" fill="#556679" font-size="28">Debe</text><text x="1240" y="478" text-anchor="end" fill="#556679" font-size="28">Haber</text><line x1="135" y1="505" x2="1265" y2="505" stroke="#d9e1ec"/><text x="145" y="554" fill="#22374b" font-size="29">Clientes / cuenta por cobrar</text><text x="1010" y="554" text-anchor="end" fill="#123e80" font-size="30" font-weight="700">—</text><text x="1240" y="554" text-anchor="end" fill="#9b5700" font-size="30" font-weight="700">100,00</text><line x1="135" y1="579" x2="1265" y2="579" stroke="#d9e1ec"/><text x="145" y="628" fill="#22374b" font-size="29">Ingresos o devoluciones sobre ventas</text><text x="1010" y="628" text-anchor="end" fill="#123e80" font-size="30" font-weight="700">100,00</text><text x="1240" y="628" text-anchor="end" fill="#9b5700" font-size="30" font-weight="700">—</text><line x1="135" y1="653" x2="1265" y2="653" stroke="#d9e1ec"/><text x="145" y="702" fill="#22374b" font-size="29">Inventario</text><text x="1010" y="702" text-anchor="end" fill="#123e80" font-size="30" font-weight="700">50,00</text><text x="1240" y="702" text-anchor="end" fill="#9b5700" font-size="30" font-weight="700">—</text><line x1="135" y1="727" x2="1265" y2="727" stroke="#d9e1ec"/><text x="145" y="776" fill="#22374b" font-size="29">Costo de ventas</text><text x="1010" y="776" text-anchor="end" fill="#123e80" font-size="30" font-weight="700">—</text><text x="1240" y="776" text-anchor="end" fill="#9b5700" font-size="30" font-weight="700">50,00</text><text x="145" y="858" fill="#087660" font-size="28" font-weight="700">Debe 150 = Haber 150</text><text x="1350" y="494" fill="#123e80" font-size="35" font-weight="700">Retorna 1 unidad</text><text x="1350" y="558" fill="#22374b" font-size="30">Inventario: +50 al costo</text><text x="1350" y="622" fill="#22374b" font-size="30">Deuda del cliente: −100</text><text x="1350" y="686" fill="#22374b" font-size="30">Costo de ventas: −50</text><text x="110" y="986" fill="#53677a" font-size="25">B1 Academy · Práctica equivalente de SAP Business One</text><text x="1770" y="986" fill="#123e80" font-size="25">5 / 15</text></g></svg>