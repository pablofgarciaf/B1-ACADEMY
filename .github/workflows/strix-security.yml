name: 🛡️ Security Scan (Strix)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday 2 AM

jobs:
  strix-scan:
    name: 🔍 Strix AI Pentest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Strix Security Scan
        run: |
          docker run --rm -v ${{ github.workspace }}:/app \
            ghcr.io/usestrix/strix:latest scan /app \
            --llm-provider omniroute \
            --llm-model nemotron-3-super-120b \
            --format sarif \
            --output strix-results.sarif \
            --fail-on critical,high
        env:
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: strix-results.sarif
          category: strix

      - name: Comment PR with Security Summary
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('strix-results.sarif')) {
              const sarif = JSON.parse(fs.readFileSync('strix-results.sarif', 'utf8'));
              const runs = sarif.runs || [];
              let critical = 0, high = 0, medium = 0, low = 0;
              for (const run of runs) {
                const results = run.results || [];
                for (const result of results) {
                  const level = result.level || 'note';
                  if (level === 'error') critical++;
                  else if (level === 'warning') high++;
                  else if (level === 'note') medium++;
                  else low++;
                }
              }
              const body = `## 🛡️ Strix Security Scan Results\n\n| Severity | Count |\n|----------|-------|\n| 🔴 Critical | ${critical} |\n| 🟠 High | ${high} |\n| 🟡 Medium | ${medium} |\n| 🟢 Low/Info | ${low} |\n\n${critical > 0 || high > 0 ? '⚠️ **Action required**: Critical/High vulnerabilities found. Review before merge.' : '✅ No critical or high vulnerabilities detected.'}`;
              
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number
              });
              const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Strix Security'));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body
                });
              }
            }